name: Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'vendor/**'
      - 'vendor-bin/**'
      - '.php-cs-fixer.dist.php'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read

concurrency:
  group: lint-php-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest
    name: php-lint

    steps:
      - name: Checkout
        uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3 # v3

      - name: Lint PHP sources
        run: |
          php_version="$(cat .php-version)"
          jq -e --arg php "^$php_version" '.require.php == $php' composer.json
          grep -Fqx "ARG PHP_VERSION=$php_version" .docker/php/Dockerfile
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/code:ro" \
            -w /code "php:${php_version}-cli" \
            sh -c 'find bin config migrations public src tests -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l'

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: php-lint

    if: always()

    name: php-lint-summary

    steps:
      - name: Summary status
        run: if ${{ needs.php-lint.result != 'success' && needs.php-lint.result != 'skipped' }}; then exit 1; fi