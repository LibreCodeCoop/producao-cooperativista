name: Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'vendor/**'
      - 'vendor-bin/**'
      - '.php-cs-fixer.dist.php'
      - '.docker/php/Dockerfile'
      - '.github/actions/php-version/**'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read

concurrency:
  group: lint-php-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest
    name: php-lint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve PHP version
        id: runtime
        uses: ./.github/actions/php-version

      - name: Lint PHP sources
        run: |
          php_version="${{ steps.runtime.outputs.php }}"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/code:ro" \
            -w /code "php:${php_version}-cli" \
            sh -c 'find bin config migrations public src tests -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l'

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: php-lint

    if: always()

    name: php-lint-summary

    steps:
      - name: Summary status
        run: if ${{ needs.php-lint.result != 'success' && needs.php-lint.result != 'skipped' }}; then exit 1; fi