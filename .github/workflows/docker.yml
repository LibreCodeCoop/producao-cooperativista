name: Docker validation

on:
  pull_request:
    paths:
      - '.github/workflows/docker.yml'
      - '.docker/php/Dockerfile'
      - '.github/actions/php-version/**'
      - '.docker/php/**'
      - 'docker-compose.yml'
      - 'composer.json'
      - 'tests/ci/check-php-runtime.sh'
      - 'tests/ci/check-php-runtime.test.sh'

permissions:
  contents: read

concurrency:
  group: docker-validation-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve PHP version
        id: runtime
        uses: ./.github/actions/php-version

      - name: Validate Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Check the image verifier without Docker
        run: sh tests/ci/check-php-runtime.test.sh

      - name: Build the PHP-FPM runtime used by the application
        run: docker build --pull --build-arg PHP_IMAGE="${{ steps.runtime.outputs.image }}" --tag librecode-pdc-ci:php-fpm -f .docker/php/Dockerfile .docker/php

      - name: Verify PHP version and calendar runtime
        run: sh tests/ci/check-php-runtime.sh "${{ steps.runtime.outputs.php }}" librecode-pdc-ci:php-fpm

      - name: Verify authoritative Composer autoload refresh on startup
        run: sh tests/ci/check-entrypoint-autoload.test.sh librecode-pdc-ci:php-fpm
