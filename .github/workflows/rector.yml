name: Rector

on:
  pull_request:
    paths:
      - '.github/workflows/rector.yml'
      - '.php-version'
      - 'rector.php'
      - 'composer.json'
      - 'composer.lock'
      - 'vendor-bin/rector/**'
      - 'src/**'
      - 'bin/**'
      - 'migrations/**'
      - 'tests/php/**'

permissions:
  contents: read

concurrency:
  group: rector-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  rector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read and validate PHP version
        id: runtime
        run: |
          php_version="$(cat .php-version)"
          jq -e --arg php "^$php_version" '.require.php == $php' composer.json
          grep -Fqx "ARG PHP_VERSION=$php_version" .docker/php/Dockerfile
          echo "php=$php_version" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2
        with:
          php-version: ${{ steps.runtime.outputs.php }}
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Rector dry run
        run: composer run rector:check
