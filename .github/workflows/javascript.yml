name: JavaScript

on:
  pull_request:
    paths:
      - '.github/workflows/javascript.yml'
      - '.nvmrc'
      - 'public/js/**'
      - 'public/css/**'
      - 'resources/scss/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/js/**'
      - 'templates/**'
      - 'src/Controller/Api/**'
      - 'src/Controller/Acoes.php'
      - 'src/Helper/Sse.php'
      - 'src/Helper/SseEventMessage.php'

permissions:
  contents: read

concurrency:
  group: javascript-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install Sass compiler
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Check generated CSS
        run: npm run css:check

      - name: Validate JavaScript syntax
        run: find public/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Unit tests and minimum code coverage
        run: |
          node --experimental-test-coverage \
            --test-coverage-include='public/js/*.js' \
            --test-coverage-lines=90 \
            --test-coverage-branches=80 \
            --test-coverage-functions=75 \
            --test tests/js/*.test.cjs
