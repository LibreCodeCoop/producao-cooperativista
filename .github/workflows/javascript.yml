name: JavaScript

# Run on every PR: cross-layer integration and generated assets make a
# path allowlist easy to under-specify and increasingly difficult to review.
on: pull_request

permissions:
  contents: read

concurrency:
  group: javascript-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install locked Node.js dependencies for tests
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: find public/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Unit tests and minimum code coverage
        run: |
          node --experimental-test-coverage \
            --test-coverage-include='public/js/*.js' \
            --test-coverage-lines=90 \
            --test-coverage-branches=80 \
            --test-coverage-functions=75 \
            --test tests/js/*.test.cjs
