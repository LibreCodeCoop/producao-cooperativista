version: 2
updates:
  - package-ecosystem: composer
    directories:
      - /
      - /vendor-bin/cs
      - /vendor-bin/unit
      - /vendor-bin/psalm
      - /vendor-bin/rector
    schedule:
      interval: weekly
    groups:
      composer-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /.docker/php
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
