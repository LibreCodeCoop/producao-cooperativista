version: 2
updates:
  # The root application and each isolated vendor-bin tool have independent
  # composer.json/composer.lock files, and all must be updated.
  - package-ecosystem: composer
    directories:
      - /
      - /vendor-bin/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      symfony:
        patterns:
          - "symfony/*"
        update-types:
          - minor
          - patch
      doctrine:
        patterns:
          - "doctrine/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stylelint 18 is incompatible with stylelint-config-recommended-scss 17.x.
      # Revisit this when the upstream SCSS preset supports Stylelint 18.
      - dependency-name: "stylelint"
        versions: ["18.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Dockerfile ARG/PHP version and COPY --from are handled by Renovate.
  # Do not enable the Dockerfile ecosystem here or both bots will overlap.
