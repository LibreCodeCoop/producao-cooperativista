version: 2
updates:
  # The root application and each isolated vendor-bin tool have independent
  # composer.json/composer.lock files, and all must be updated.
  - package-ecosystem: composer
    directories:
      - /
      - /vendor-bin/cs
      - /vendor-bin/unit
      - /vendor-bin/psalm
      - /vendor-bin/rector
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      symfony:
        patterns:
          - "symfony/*"
        update-types:
          - minor
          - patch
      doctrine:
        patterns:
          - "doctrine/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Dockerfile ARG/PHP version and COPY --from are handled by Renovate.
  # Do not enable the Dockerfile ecosystem here or both bots will overlap.
