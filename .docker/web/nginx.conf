server_tokens off;

server {
    listen 80;
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Expose only the Symfony public directory; application configuration
    # and financial imports must never be served as static files.
    root /app/public;
    index index.php;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~* \.(jpg|jpeg|png|ico|svg|css|js|woff|woff2)$ {
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_read_timeout 6000s;
        fastcgi_send_timeout 6000s;
        fastcgi_connect_timeout 6000s;
    }

    location ~ \.php$ {
        return 404;
    }
}
